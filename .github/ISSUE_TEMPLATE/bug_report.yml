name: Bug report
description: Report a reproducible plugin defect without secrets or customer data.
body:
  - type: markdown
    attributes:
      value: Do not include API tokens, credentials, customer data, or private instance URLs.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
